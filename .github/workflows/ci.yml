name: ci

on:
  pull_request:
  push:
    branches: [main]   # the release branch: tags are cut from main
  workflow_dispatch:

permissions:
  contents: read

env:
  # The gc commit conformance runs against. Bump deliberately: a new
  # conformance requirement must show up here, not pass silently.
  GASCITY_PIN: baf57f4ff60ea949d2a0c3922a65be95cf6b7cc1
  # The conformance run pins one published preview archive by commit and
  # checksum, so a newer preview never changes what conformance tests.
  REX_PIN: 0.1.0-preview.22
  REX_URL: https://blob.superlogical.com/download/rex/preview/a086db17db8d464627c77e3bb0be6d462668b0ac/rex-linux-amd64.tar.gz
  REX_SHA256: 90ef882c73d5c8fa154586ce0cc36a835a6f0b80c150eb38d3cd127b18476e3c

jobs:
  pack-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned gc
        run: |
          go install "github.com/gastownhall/gascity/cmd/gc@${GASCITY_PIN}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run pack checks
        run: bash pack/tests/verify.sh

      # The provider e2e suites run against the in-repo fake rex, so this job
      # covers them without downloading the real application. Conformance still
      # runs the pinned rex.
      - name: Fake-backed e2e
        run: make test-e2e

  conformance:
    name: Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Build the provider
        run: make build

      # gc is a tool install, not a Go import: the pack keeps zero gascity
      # dependencies and still runs against the pinned gc.
      - name: Install pinned gc
        run: |
          go install "github.com/gastownhall/gascity/cmd/gc@${GASCITY_PIN}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The provider's session path shells out to the rex CLI, so install the
      # pinned preview archive before running conformance.
      - name: Install pinned rex
        run: |
          mkdir -p "$RUNNER_TEMP/rex-bin"
          curl -fsSL "$REX_URL" -o "$RUNNER_TEMP/rex.tar.gz"
          echo "$REX_SHA256  $RUNNER_TEMP/rex.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rex.tar.gz" -C "$RUNNER_TEMP/rex-bin"
          echo "$RUNNER_TEMP/rex-bin" >> "$GITHUB_PATH"
          version=$("$RUNNER_TEMP/rex-bin/rex" version)
          echo "$version"
          if ! echo "$version" | grep -q "$REX_PIN"
          then
            echo "rex is not the pinned $REX_PIN" >&2
            exit 1
          fi
          # pack/rex-min-version must equal REX_PIN, so the doctor check and
          # the conformance pin cannot drift apart.
          min_version=$(tr -d '[:space:]' < pack/rex-min-version)
          if [ "$min_version" != "$REX_PIN" ]
          then
            echo "pack/rex-min-version ($min_version) does not match REX_PIN ($REX_PIN)" >&2
            exit 1
          fi

      - name: Check the conformance harness
        run: pack/tests/check-conformance.sh --binary bin/gc-runtime-rex

      - name: Conformance
        run: pack/tests/conformance.sh --binary bin/gc-runtime-rex
