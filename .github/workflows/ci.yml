name: ci

on:
  pull_request:
  push:
    branches: [main]   # the release branch: tags are cut from main
  workflow_dispatch:
    inputs:
      ci_rex:
        description: Install the pinned rex CLI and rerun conformance with it (off by default)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The gc commit conformance runs against. Bump deliberately: a new
  # conformance requirement must show up here, not pass silently.
  GASCITY_PIN: baf57f4ff60ea949d2a0c3922a65be95cf6b7cc1
  # The optional rex run pins one published preview archive by commit and
  # checksum, so a newer preview never changes what ci_rex tests.
  REX_PIN: 0.1.0-preview.22
  REX_URL: https://blob.superlogical.com/download/rex/preview/a086db17db8d464627c77e3bb0be6d462668b0ac/rex-linux-amd64.tar.gz
  REX_SHA256: 90ef882c73d5c8fa154586ce0cc36a835a6f0b80c150eb38d3cd127b18476e3c

jobs:
  pack-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned gc
        run: |
          go install "github.com/gastownhall/gascity/cmd/gc@${GASCITY_PIN}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run pack checks
        run: bash pack/tests/verify.sh

  conformance:
    name: Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Build the provider
        run: make build

      # gc is a tool install, not a Go import: the pack keeps zero gascity
      # dependencies and still runs against the pinned gc.
      - name: Install pinned gc
        run: |
          go install "github.com/gastownhall/gascity/cmd/gc@${GASCITY_PIN}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # No rex is installed. gc replaces GC_REX_CITY with GC_EXEC_CITY_NAME,
      # so the provider uses a scratch namespace and leaves no session behind.
      - name: Conformance (no rex)
        run: pack/tests/conformance.sh --binary bin/gc-runtime-rex

      - name: Check the conformance harness
        run: pack/tests/check-conformance.sh --binary bin/gc-runtime-rex

      # Optional: run the same suite with a real rex CLI. conformance.sh does
      # not need rex, but a real CLI is the only thing that exercises the
      # provider's session path. Off unless the dispatch input asks for it.
      - name: Install pinned rex
        if: inputs.ci_rex
        run: |
          mkdir -p "$RUNNER_TEMP/rex-bin"
          curl -fsSL "$REX_URL" -o "$RUNNER_TEMP/rex.tar.gz"
          echo "$REX_SHA256  $RUNNER_TEMP/rex.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rex.tar.gz" -C "$RUNNER_TEMP/rex-bin"
          echo "$RUNNER_TEMP/rex-bin" >> "$GITHUB_PATH"
          version=$("$RUNNER_TEMP/rex-bin/rex" version)
          echo "$version"
          echo "$version" | grep -q "$REX_PIN" || { echo "rex is not the pinned $REX_PIN" >&2; exit 1; }

      - name: Conformance (pinned rex)
        if: inputs.ci_rex
        run: pack/tests/conformance.sh --binary bin/gc-runtime-rex
